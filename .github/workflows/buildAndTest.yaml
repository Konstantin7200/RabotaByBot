name: CI
on: 
  push:
    branches:
    - backend/stable
  pull_request:
    branches:
      - backend/stable
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test